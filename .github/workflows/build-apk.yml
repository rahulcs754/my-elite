# Builds a debug APK on every push and attaches it to the run as "elite-apk".
# Open the repo's Actions tab -> latest run -> Artifacts -> download elite-apk.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # GitHub's Ubuntu runners come with the Android SDK preinstalled.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Point Gradle at the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK"
          ls "$SDK" || { echo "No Android SDK found on this runner"; exit 1; }
          echo "sdk.dir=$SDK" > local.properties
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          [ -n "$SDKMANAGER" ] && (yes | "$SDKMANAGER" --licenses > /dev/null || true)
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: elite-apk
          path: app/build/outputs/apk/debug/app-debug.apk
